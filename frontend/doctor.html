<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Management</title>

<link rel="stylesheet" href="doctor.css">

</head>


<body>


<header>

<h1>👨‍⚕️ Doctor Management</h1>


<button onclick="window.location.href='admin.html'">

← Back to Dashboard

</button>


</header>





<!-- Dashboard -->


<div class="dashboard">


<div class="card">


<h3>Total Doctors</h3>


<h1 id="count">0</h1>


</div>


</div>







<!-- Doctor Form -->


<div class="container">


<h2>Add Doctor Details</h2>




<input

type="text"

id="doctorName"

placeholder="Doctor Name"

required>



<select id="specialization" required>


<option value="">

Select Specialization

</option>


<option>
General Physician
</option>


<option>
Cardiologist
</option>


<option>
Neurologist
</option>


<option>
Orthopedic
</option>


<option>
Pediatrician
</option>


<option>
Dentist
</option>


<option>
Dermatologist
</option>


<option>
Gynecologist
</option>


</select>






<input

type="text"

id="phone"

maxlength="10"

placeholder="Phone Number"

required>






<input

type="email"

id="email"

placeholder="Email"

required>






<input

type="text"

id="availableTime"

placeholder="Available Time (Example: 09:00 AM - 01:00 PM)"

required>






<select id="status">


<option value="Available">

Available

</option>


<option value="On Leave">

On Leave

</option>


</select>







<button

id="saveBtn"

onclick="saveDoctor()">



Save Doctor



</button>



</div>









<!-- Search Doctor -->


<div class="container">


<h2>Search Doctor</h2>



<input

type="text"

id="searchInput"

placeholder="Search by Doctor Name or Specialization">






<button onclick="searchDoctor()">


🔍 Search


</button>






<button onclick="loadDoctors()">



📋 Show All



</button>



</div>









<h2 class="title">


Doctor List


</h2>








<table>


<thead>


<tr>


<th>
Name
</th>


<th>
Specialization
</th>


<th>
Phone
</th>


<th>
Email
</th>


<th>
Available Time
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>





<tbody id="doctorTable">


</tbody>



</table>








<script src="doctorScript.js"></script>


</body>


</html>
